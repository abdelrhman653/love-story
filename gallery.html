<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استوديو صورنا ❤️ - Asmaa</title>
    <style>
        :root {
            --primary-bg: #110522;
            --card-bg: rgba(27, 13, 46, 0.85);
            --accent-pink: #ff4d88;
            --accent-pink-glow: rgba(255, 77, 136, 0.4);
            --border-pink: rgba(255, 102, 153, 0.25);
            --text-main: #ffffff;
            --text-muted: #d8c3f1;
            --text-sub: #b39ddb;
            --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--primary-bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px 12px 40px 12px;
            position: relative;
            overflow-x: hidden;
        }

        .page-bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 350px;
            background: linear-gradient(to bottom, rgba(17, 5, 34, 0.4), var(--primary-bg)), url('bg.jpg') center/cover no-repeat;
            z-index: 0;
            opacity: 0.6;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 420px;
            z-index: 10;
            position: relative;
        }

        .header-card {
            background: var(--card-bg);
            border: 1px solid var(--border-pink);
            border-radius: 25px;
            padding: 20px 15px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
        }

        .love-badge {
            display: inline-block;
            background: rgba(255, 77, 136, 0.2);
            border: 1px solid rgba(255, 77, 136, 0.4);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            color: #ff80ab;
            margin-bottom: 10px;
        }

        .user-name {
            font-size: 24px;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .app-section {
            background: var(--card-bg);
            border: 1px solid var(--border-pink);
            border-radius: 22px;
            padding: 18px;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
        }

        .app-section-title {
            font-size: 15px;
            color: #ff99c2;
            text-align: center;
            margin-bottom: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .upload-dropzone {
            border: 2px dashed rgba(255, 77, 136, 0.4);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            background: rgba(255, 77, 136, 0.03);
            transition: var(--transition-smooth);
            margin-bottom: 15px;
            font-size: 13px;
            color: #ffe6ee;
        }

        .upload-dropzone:hover {
            background: rgba(255, 77, 136, 0.08);
            border-color: var(--accent-pink);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .gallery-item {
            position: relative;
            border-radius: 14px;
            overflow: hidden;
            aspect-ratio: 1;
            border: 1px solid var(--border-pink);
            background: #230f3c;
            cursor: pointer;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.05);
        }

        .gallery-delete {
            position: absolute;
            top: 6px;
            left: 6px;
            background: rgba(0, 0, 0, 0.6);
            color: #ff4d4d;
            border: none;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            cursor: pointer;
            transition: var(--transition-smooth);
            z-index: 2;
        }

        .gallery-delete:hover {
            background: #ff4d4d;
            color: white;
        }

        .back-btn {
            width: 100%;
            padding: 14px;
            border-radius: 22px;
            border: 1px solid rgba(255, 102, 153, 0.4);
            background: rgba(255, 77, 136, 15%);
            color: var(--text-main);
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 0 15px var(--accent-pink-glow);
            transition: var(--transition-smooth);
            text-decoration: none;
            margin-top: 10px;
        }

        .back-btn:hover {
            background: rgba(255, 77, 136, 0.25);
            border-color: var(--accent-pink);
        }

        /* نافذة تكبير الصورة (Lightbox) */
        .lightbox-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .lightbox-modal.active {
            display: flex;
        }

        .lightbox-content {
            max-width: 100%;
            max-height: 90vh;
            border-radius: 16px;
            border: 1px solid var(--accent-pink);
            object-fit: contain;
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="page-bg-overlay"></div>

    <div class="container">
        <div class="header-card">
            <div class="love-badge">معرض الذكريات ✨❤️</div>
            <div class="user-name">📸 استوديو صورنا</div>
        </div>

        <div class="app-section">
            <div class="app-section-title">🖼️ رفع صور جديدة</div>
            <div class="upload-dropzone" id="dropZone">
                <span>اسحب الصور هنا أو اضغط لرفع صور جديدة بكل سهولة 📷</span>
                <input type="file" id="imageUploadInput" accept="image/*" multiple style="display: none;">
            </div>
            
            <div class="app-section-title" style="margin-top: 20px;">✨ جميع الصور (الأساسية والمرفوعة)</div>
            <div class="gallery-grid" id="galleryGrid"></div>
        </div>

        <a href="index.html" class="back-btn">
            🏠 العودة إلى الصفحة الرئيسية
        </a>
    </div>

    <!-- نافذة تكبير الصورة -->
    <div class="lightbox-modal" id="lightboxModal">
        <button class="lightbox-close" id="lightboxClose">✕</button>
        <img src="" alt="Enlarged" class="lightbox-content" id="lightboxImg">
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const Storage = {
                get(key, defaultVal) {
                    try {
                        const item = localStorage.getItem('asmaa_love_' + key);
                        return item ? JSON.parse(item) : defaultVal;
                    } catch (e) {
                        return defaultVal;
                    }
                },
                set(key, val) {
                    try {
                        localStorage.setItem('asmaa_love_' + key, JSON.stringify(val));
                    } catch (e) {}
                }
            };

            // الصور الأصلية الأساسية للمشروع
            const originalImages = [
                'img1.jpg',
                'img2.jpg',
                'img3.jpg',
                'img4.jpg',
                'img5.jpg',
                'img6.jpg',
                'img7.jpg',
                'img8.jpg'
            ];

            let uploadedImages = Storage.get('gallery', []);
            
            const galleryGrid = document.getElementById('galleryGrid');
            const dropZone = document.getElementById('dropZone');
            const imageUploadInput = document.getElementById('imageUploadInput');
            const lightboxModal = document.getElementById('lightboxModal');
            const lightboxImg = document.getElementById('lightboxImg');
            const lightboxClose = document.getElementById('lightboxClose');

            function renderGallery() {
                if (!galleryGrid) return;
                galleryGrid.innerHTML = '';

                // 1. عرض الصور الأصلية أولاً (غير قابلة للحذف لكونها أصلية بالمشروع)
                originalImages.forEach((imgSrc) => {
                    const div = document.createElement('div');
                    div.className = 'gallery-item';
                    div.innerHTML = `<img src="${imgSrc}" alt="Original Memory" loading="lazy" onerror="this.style.display='none'">`;
                    div.addEventListener('click', () => openLightbox(imgSrc));
                    galleryGrid.appendChild(div);
                });

                // 2. عرض الصور المرفوعة بواسطة المستخدم (مع إمكانية الحذف)
                uploadedImages.forEach((imgSrc, index) => {
                    const div = document.createElement('div');
                    div.className = 'gallery-item';
                    div.innerHTML = `
                        <img src="${imgSrc}" alt="User Memory" loading="lazy">
                        <button class="gallery-delete" data-index="${index}" title="حذف الصورة">✕</button>
                    `;
                    
                    // فتح التكبير عند الضغط على الصورة (وليس زر الحذف)
                    div.querySelector('img').addEventListener('click', () => openLightbox(imgSrc));
                    
                    div.querySelector('.gallery-delete').addEventListener('click', (e) => {
                        e.stopPropagation();
                        uploadedImages.splice(index, 1);
                        Storage.set('gallery', uploadedImages);
                        renderGallery();
                    });

                    galleryGrid.appendChild(div);
                });
            }

            // تفعيل رفع الصور والسحب والإفلات
            if (dropZone && imageUploadInput) {
                dropZone.addEventListener('click', () => imageUploadInput.click());
                
                imageUploadInput.addEventListener('change', (e) => {
                    const files = e.target.files;
                    handleFiles(files);
                });

                dropZone.addEventListener('dragover', (e) => { e.preventDefault(); });
                dropZone.addEventListener('drop', (e) => {
                    e.preventDefault();
                    const files = e.dataTransfer.files;
                    handleFiles(files);
                });
            }

            function handleFiles(files) {
                for (let file of files) {
                    if (!file.type.startsWith('image/')) continue;
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        uploadedImages.push(event.target.result);
                        Storage.set('gallery', uploadedImages);
                        renderGallery();
                    };
                    reader.readAsDataURL(file);
                }
            }

            // Lightbox (تكبير الصورة)
            function openLightbox(src) {
                if (lightboxImg && lightboxModal) {
                    lightboxImg.src = src;
                    lightboxModal.classList.add('active');
                }
            }

            function closeLightbox() {
                if (lightboxModal) {
                    lightboxModal.classList.remove('active');
                }
            }

            if (lightboxClose) lightboxClose.addEventListener('click', closeLightbox);
            if (lightboxModal) {
                lightboxModal.addEventListener('click', (e) => {
                    if (e.target === lightboxModal) closeLightbox();
                });
            }

            renderGallery();
        });
    </script>
</body>
</html>
